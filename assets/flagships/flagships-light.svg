<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Flagship projects index: Six projects that earn a closer look.">
  <defs>
  <style>
    .cell   { animation: reveal 0.55s both; }
    .halo   { opacity: 0; animation: spotlight 16s linear infinite; }
    .wave   { animation: wave 5s linear infinite; }
    .pulse  { animation: pulse 4s ease-in-out infinite; }
    .now    { animation: pulse 1.6s ease-in-out infinite; }
    .ripple { transform-origin: center; animation: ripple 1.6s linear infinite; }
    @keyframes reveal    { from { opacity: 0; } to { opacity: 1; } }
    @keyframes spotlight { 0% { opacity: 0; } 4%, 10% { opacity: 0.55; } 14%, 100% { opacity: 0; } }
    @keyframes wave      { 0% { opacity: 0.4; } 10%, 20% { opacity: 1; } 30%, 100% { opacity: 0.4; } }
    @keyframes pulse     { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes ripple    { from { transform: scale(1); opacity: 0.5; } to { transform: scale(2.25); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .cell, .halo, .wave, .pulse, .now, .ripple { animation: none; }
      .cell, .wave, .pulse, .now { opacity: 1; }
      .halo, .ripple { opacity: 0; }
    }
  </style>
  </defs>
  <g data-bg="#f6f8fa">    <rect width="1200" height="480" fill="#f6f8fa"/>
    <text x="52" y="44" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#1f2328">Six projects that earn a closer look.</text>
    <text x="52" y="68" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#34383c">Empirical benchmarks, security primitives, and measured system performance.</text>
    <text x="1148" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#1f2328" text-anchor="end">06</text>
    <text x="1148" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" fill="#3e444a" text-anchor="end" letter-spacing="1.5">FLAGSHIPS</text>
    <line x1="52" y1="86" x2="1148" y2="86" stroke="#656d76" stroke-width="1"/>
    <g data-bg="#f6f8fa">      <rect x="52" y="102" width="536" height="110" rx="6" fill="#f6f8fa" stroke="#656d76" stroke-width="1"/>
      <rect x="52" y="102" width="4" height="110" rx="2" fill="#1a931a"/>
      <text x="72" y="130" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2328">ocaml_limit</text>
      <text x="242" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#0f560f">OCaml / Quant</text>
      <text x="568" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#1f2328" text-anchor="end">under 1 µs</text>
      <text x="568" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="400" fill="#3e444a" text-anchor="end">matching latency</text>
      <line x1="72" y1="158" x2="568" y2="158" stroke="#656d76" stroke-width="1" stroke-opacity="0.25"/>
      <text x="72" y="184" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#34383c">Sub-microsecond matching with live financial dashboard.</text>
    </g>
    <g data-bg="#f6f8fa">      <rect x="612" y="102" width="536" height="110" rx="6" fill="#f6f8fa" stroke="#656d76" stroke-width="1"/>
      <rect x="612" y="102" width="4" height="110" rx="2" fill="#931a1a"/>
      <text x="632" y="130" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2328">ClearHash</text>
      <text x="802" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#881818">Rust / Cybersec</text>
      <text x="1128" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#1f2328" text-anchor="end">SLSA verified</text>
      <text x="1128" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="400" fill="#3e444a" text-anchor="end">verification</text>
      <line x1="632" y1="158" x2="1128" y2="158" stroke="#656d76" stroke-width="1" stroke-opacity="0.25"/>
      <text x="632" y="184" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#34383c">Byte-level security scanner checking source against binaries.</text>
    </g>
    <g data-bg="#f6f8fa">      <rect x="52" y="224" width="536" height="110" rx="6" fill="#f6f8fa" stroke="#656d76" stroke-width="1"/>
      <rect x="52" y="224" width="4" height="110" rx="2" fill="#93751a"/>
      <text x="72" y="252" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2328">datafest-2026</text>
      <text x="242" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#5b4810">R / Analyst</text>
      <text x="568" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#1f2328" text-anchor="end">3x more ER visits</text>
      <text x="568" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="400" fill="#3e444a" text-anchor="end">observed pattern</text>
      <line x1="72" y1="280" x2="568" y2="280" stroke="#656d76" stroke-width="1" stroke-opacity="0.25"/>
      <text x="72" y="306" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#34383c">Transportation and emergency care across 58k hospital patients.</text>
    </g>
    <g data-bg="#f6f8fa">      <rect x="612" y="224" width="536" height="110" rx="6" fill="#f6f8fa" stroke="#656d76" stroke-width="1"/>
      <rect x="612" y="224" width="4" height="110" rx="2" fill="#1a931a"/>
      <text x="632" y="252" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2328">EconOS</text>
      <text x="802" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#0f560f">Python / Quant</text>
      <text x="1128" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#1f2328" text-anchor="end">PPO economy</text>
      <text x="1128" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="400" fill="#3e444a" text-anchor="end">environment</text>
      <line x1="632" y1="280" x2="1128" y2="280" stroke="#656d76" stroke-width="1" stroke-opacity="0.25"/>
      <text x="632" y="306" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#34383c">Multi-agent reinforcement learning decentralized economy.</text>
    </g>
    <g data-bg="#f6f8fa">      <rect x="52" y="346" width="536" height="110" rx="6" fill="#f6f8fa" stroke="#656d76" stroke-width="1"/>
      <rect x="52" y="346" width="4" height="110" rx="2" fill="#931a1a"/>
      <text x="72" y="374" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2328">halberd</text>
      <text x="242" y="374" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#881818">Go / Cybersec</text>
      <text x="568" y="374" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#1f2328" text-anchor="end">p50 ≤ 200 µs</text>
      <text x="568" y="392" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="400" fill="#3e444a" text-anchor="end">latency p50</text>
      <line x1="72" y1="402" x2="568" y2="402" stroke="#656d76" stroke-width="1" stroke-opacity="0.25"/>
      <text x="72" y="428" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#34383c">JSON-RPC firewall evaluating MCP tool calls against strict policy.</text>
    </g>
    <g data-bg="#f6f8fa">      <rect x="612" y="346" width="536" height="110" rx="6" fill="#f6f8fa" stroke="#656d76" stroke-width="1"/>
      <rect x="612" y="346" width="4" height="110" rx="2" fill="#931a89"/>
      <text x="632" y="374" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2328">enclave</text>
      <text x="802" y="374" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#7b1673">Next.js / AI/ML</text>
      <text x="1128" y="374" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#1f2328" text-anchor="end">0 B egress</text>
      <text x="1128" y="392" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="400" fill="#3e444a" text-anchor="end">privacy gate</text>
      <line x1="632" y1="402" x2="1128" y2="402" stroke="#656d76" stroke-width="1" stroke-opacity="0.25"/>
      <text x="632" y="428" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#34383c">Private clinical document extraction workbench measuring leakage.</text>
    </g>
  </g>
</svg>
