<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Six-project editorial index focused on performance, health and evidence, and security and markets. Project index showing ocaml_limit as an OCaml quantitative system with sub-microsecond matching and a live financial dashboard. Project index showing LinuxBenchHub as a Rails analyst system that compares Linux performance with automated speed tests on identical hardware. Project index showing MedCore as a React health technology system for digital medical records in African clinics and a Yale Africa Innovation Symposium IV winner. Project index showing datafest-2026 as an R healthcare study of approximately 1 million patients that found unreliable transportation leads to three times more emergency room visits. Project index showing ClearHash as a Rust security scanner that inspects software byte by byte for tampering and malicious backdoors before release. Project index showing CapitolAlpha as a Python financial investigation of more than 16,000 Congressional stock trades, with a 2.58 percent annual market edge.">
