<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-label="ClearHash flagship card: Cybersec project in Rust, a byte-level software security scanner that catches tampering and malicious backdoors before release.">
  <g data-bg="#161b22">
    <rect x="1" y="1" width="478" height="278" rx="14" fill="#161b22" stroke="#7d8590" stroke-width="2"/>
    <g fill="#1f2630" opacity="0.55">
      <circle cx="28" cy="58" r="1"/><circle cx="46" cy="58" r="1"/><circle cx="64" cy="58" r="1"/><circle cx="82" cy="58" r="1"/>
      <circle cx="28" cy="76" r="1"/><circle cx="46" cy="76" r="1"/><circle cx="64" cy="76" r="1"/><circle cx="82" cy="76" r="1"/>
      <circle cx="398" cy="58" r="1"/><circle cx="416" cy="58" r="1"/><circle cx="434" cy="58" r="1"/>
      <circle cx="398" cy="76" r="1"/><circle cx="416" cy="76" r="1"/><circle cx="434" cy="76" r="1"/>
    </g>
    <rect x="2" y="2" width="476" height="6" rx="3" fill="#e87373"/>

    <text x="26" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="2" fill="#c1c5ca">FLAGSHIP 03</text>
    <g data-bg="#33272d">
      <rect x="380" y="19" width="74" height="24" rx="12" fill="#33272d"/>
      <text x="417" y="35" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f0a1a1" text-anchor="middle">Cybersec</text>
    </g>

    <rect x="26" y="78" width="72" height="72" rx="12" fill="#33272d" stroke="#e87373" stroke-width="2"/>
    <text x="62" y="124" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="27" font-weight="800" letter-spacing="-1" fill="#f0a1a1" text-anchor="middle">#H</text>

    <text x="122" y="91" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="23" font-weight="750" fill="#e6edf3">ClearHash</text>
    <text x="122" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="1.5" fill="#f0a1a1">RUST  /  CYBERSEC</text>
    <text x="122" y="151" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#d5d8db">Byte-level security scanning</text>
    <text x="122" y="174" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="13" fill="#c1c5ca">Catches tampering and malicious backdoors</text>
    <text x="122" y="192" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="13" fill="#c1c5ca">before release.</text>

    <line x1="26" y1="211" x2="454" y2="211" stroke="#7d8590" stroke-width="1" opacity="0.65"/>
    <text x="26" y="235" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" letter-spacing="1.4" fill="#c1c5ca">SCAN TARGET</text>
    <text x="26" y="263" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="15" font-weight="800" fill="#f0a1a1">TAMPERING AND BACKDOORS</text>
    <text x="454" y="263" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" letter-spacing="1.2" fill="#c1c5ca" text-anchor="end">OPEN REPOSITORY</text>
  </g>
</svg>
