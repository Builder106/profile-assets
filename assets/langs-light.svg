<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="Most-used programming languages breakdown">
  <defs>
  <style>
    .cell   { animation: reveal 0.55s both; }
    .halo   { opacity: 0; animation: spotlight 16s linear infinite; }
    .wave   { animation: wave 5s linear infinite; }
    .pulse  { animation: pulse 4s ease-in-out infinite; }
    .now    { animation: pulse 1.6s ease-in-out infinite; }
    .ripple { transform-origin: center; animation: ripple 1.6s linear infinite; }
    @keyframes reveal    { from { opacity: 0; } to { opacity: 1; } }
    @keyframes spotlight { 0% { opacity: 0; } 4%, 10% { opacity: 0.55; } 14%, 100% { opacity: 0; } }
    @keyframes wave      { 0% { opacity: 0.4; } 10%, 20% { opacity: 1; } 30%, 100% { opacity: 0.4; } }
    @keyframes pulse     { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes ripple    { from { transform: scale(1); opacity: 0.5; } to { transform: scale(2.25); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .cell, .halo, .wave, .pulse, .now, .ripple { animation: none; }
      .cell, .wave, .pulse, .now { opacity: 1; }
      .halo, .ripple { opacity: 0; }
    }
  </style>
  </defs>
  <g data-bg="#f6f8fa">    <rect width="495" height="195" rx="6" fill="#f6f8fa" stroke="#656d76" stroke-width="1"/>
    <text x="24" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#34383c" letter-spacing="1.5">LANGUAGES // DISTRIBUTION</text>
    <line x1="24" y1="44" x2="471" y2="44" stroke="#656d76" stroke-width="1" stroke-opacity="0.25"/>
    <g clip-path="url(#bar-clip)">
      <clipPath id="bar-clip"><rect x="24" y="58" width="447" height="10" rx="5"/></clipPath>
      <rect x="24" y="58" width="143" height="10" fill="#3178c6"/>
      <rect x="167" y="58" width="107" height="10" fill="#3572a5"/>
      <rect x="274" y="58" width="63" height="10" fill="#dea584"/>
      <rect x="337" y="58" width="45" height="10" fill="#ef7a08"/>
      <rect x="382" y="58" width="36" height="10" fill="#00add8"/>
      <rect x="418" y="58" width="27" height="10" fill="#555555"/>
      <rect x="445" y="58" width="27" height="10" fill="#198ce7"/>
    </g>
    <circle cx="29" cy="92" r="4" fill="#3178c6"/>
    <text x="40" y="96" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1f2328">TypeScript</text>
    <text x="184" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" fill="#34383c" text-anchor="end">32%</text>
    <circle cx="29" cy="114" r="4" fill="#3572a5"/>
    <text x="40" y="118" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1f2328">Python</text>
    <text x="184" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" fill="#34383c" text-anchor="end">24%</text>
    <circle cx="29" cy="136" r="4" fill="#dea584"/>
    <text x="40" y="140" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1f2328">Rust</text>
    <text x="184" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" fill="#34383c" text-anchor="end">14%</text>
    <circle cx="29" cy="158" r="4" fill="#ef7a08"/>
    <text x="40" y="162" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1f2328">OCaml</text>
    <text x="184" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" fill="#34383c" text-anchor="end">10%</text>
    <circle cx="265" cy="92" r="4" fill="#00add8"/>
    <text x="276" y="96" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1f2328">Go</text>
    <text x="420" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" fill="#34383c" text-anchor="end">8%</text>
    <circle cx="265" cy="114" r="4" fill="#555555"/>
    <text x="276" y="118" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1f2328">C99</text>
    <text x="420" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" fill="#34383c" text-anchor="end">6%</text>
    <circle cx="265" cy="136" r="4" fill="#198ce7"/>
    <text x="276" y="140" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1f2328">R</text>
    <text x="420" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" fill="#34383c" text-anchor="end">6%</text>
  </g>
</svg>
