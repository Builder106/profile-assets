<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="GitHub telemetry: 1,850+ commits, 100% verified">
  <defs>
  <style>
    .cell   { animation: reveal 0.55s both; }
    .halo   { opacity: 0; animation: spotlight 16s linear infinite; }
    .wave   { animation: wave 5s linear infinite; }
    .pulse  { animation: pulse 4s ease-in-out infinite; }
    .now    { animation: pulse 1.6s ease-in-out infinite; }
    .ripple { transform-origin: center; animation: ripple 1.6s linear infinite; }
    @keyframes reveal    { from { opacity: 0; } to { opacity: 1; } }
    @keyframes spotlight { 0% { opacity: 0; } 4%, 10% { opacity: 0.55; } 14%, 100% { opacity: 0; } }
    @keyframes wave      { 0% { opacity: 0.4; } 10%, 20% { opacity: 1; } 30%, 100% { opacity: 0.4; } }
    @keyframes pulse     { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes ripple    { from { transform: scale(1); opacity: 0.5; } to { transform: scale(2.25); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .cell, .halo, .wave, .pulse, .now, .ripple { animation: none; }
      .cell, .wave, .pulse, .now { opacity: 1; }
      .halo, .ripple { opacity: 0; }
    }
  </style>
  </defs>
  <g data-bg="#161b22">    <rect width="495" height="195" rx="6" fill="#161b22" stroke="#7d8590" stroke-width="1"/>
    <text x="24" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#d5d8db" letter-spacing="1.5">TELEMETRY // BUILDER106</text>
    <line x1="24" y1="44" x2="471" y2="44" stroke="#7d8590" stroke-width="1" stroke-opacity="0.25"/>
    <text x="24" y="68" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#d5d8db">Total Commits</text>
    <text x="471" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="end">1,850+</text>
    <text x="24" y="92" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#d5d8db">Commit Verification</text>
    <text x="471" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="end">100%</text>
    <text x="24" y="116" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#d5d8db">Pull Requests Merged</text>
    <text x="471" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="end">95+</text>
    <text x="24" y="140" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#d5d8db">Engineered Repos</text>
    <text x="471" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="end">20</text>
    <text x="24" y="164" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#d5d8db">OSS Track</text>
    <text x="471" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="end">GSoC 2027 Track</text>
  </g>
</svg>
