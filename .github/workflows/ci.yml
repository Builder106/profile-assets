name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install test and lint tools
        run: uv pip install --system pytest pytest-cov ruff
      - name: Run asset tests with coverage
        run: pytest
      - name: Check Ruff lint
        run: ruff check .
      - name: Check Ruff formatting
        run: ruff format --check .

  profile-readme:
    name: Audit external profile README
    runs-on: ubuntu-latest
    steps:
      - name: Check out asset repository
        uses: actions/checkout@v7
      - name: Check out profile README
        uses: actions/checkout@v7
        with:
          repository: Builder106/Builder106
          path: profile-readme
          sparse-checkout: README.md
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install audit dependency
        run: uv pip install --system pytest pytest-cov
      - name: Audit assets and external profile README
        run: python assets/audit.py --readme profile-readme/README.md

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan repository history
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
