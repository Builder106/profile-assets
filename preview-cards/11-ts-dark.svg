<svg xmlns="http://www.w3.org/2000/svg" width="130" height="130" viewBox="0 0 130 130" role="img" aria-label="11 Ts TypeScript MedCore HealthTech">
  <defs>
  <style>
    .cell   { animation: reveal 0.55s both; }
    .halo   { opacity: 0; animation: spotlight 16s linear infinite; }
    .wave   { animation: wave 5s linear infinite; }
    .pulse  { animation: pulse 4s ease-in-out infinite; }
    .now    { animation: pulse 1.6s ease-in-out infinite; }
    .ripple { transform-origin: center; animation: ripple 1.6s linear infinite; }
    @keyframes reveal    { from { opacity: 0; } to { opacity: 1; } }
    @keyframes spotlight { 0% { opacity: 0; } 4%, 10% { opacity: 0.55; } 14%, 100% { opacity: 0; } }
    @keyframes wave      { 0% { opacity: 0.4; } 10%, 20% { opacity: 1; } 30%, 100% { opacity: 0.4; } }
    @keyframes pulse     { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes ripple    { from { transform: scale(1); opacity: 0.5; } to { transform: scale(2.25); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .cell, .halo, .wave, .pulse, .now, .ripple { animation: none; }
      .cell, .wave, .pulse, .now { opacity: 1; }
      .halo, .ripple { opacity: 0; }
    }
  </style>
    <linearGradient id="g11" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#73e8cb" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#73e8cb" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g class="cell" style="animation-delay: 0.80s">
    <rect x="0.5" y="0.5" width="129" height="129" rx="4" fill="#23383a" stroke="#7d8590" stroke-width="1"/>
    <rect x="0.5" y="0.5" width="129" height="129" rx="4" fill="url(#g11)"/>
    <rect class="pulse" style="animation-delay: -2.31s" x="0.5" y="0.5" width="129" height="3" rx="1.5" fill="#73e8cb"/>
    <text x="10" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="500" fill="#73e8cb">11</text><text x="120" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" fill="#73e8cb" text-anchor="end">HealthTech</text>
    <text x="65" y="76" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="50" font-weight="700" fill="#e6edf3" text-anchor="middle" letter-spacing="-1">Ts</text>
    <text x="65" y="101" font-family="-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#d5d8db" text-anchor="middle">TypeScript</text>
    <text x="65" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#c1c5ca" text-anchor="middle">MedCore</text>
  </g>
</svg>
