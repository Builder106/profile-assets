[project]
name = "builder106-profile-assets"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=5.0",
    "ruff",
]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["assets*"]


[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "RUF",
    "ANN401",
]
ignore = [
    "E501",
    "RUF003",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["assets"]
omit = ["assets/pfp/source/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "if __name__ ==",
]
